<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Карта мотивации сотрудника</title>

<style>
:root{
  --bg1:#090B2A;
  --bg2:#171044;
  --bg3:#24145A;
  --card:rgba(255,255,255,.96);
  --card2:rgba(255,255,255,.08);
  --ink:#172033;
  --white:#ffffff;
  --mut:#667085;
  --light:#EEF1F7;
  --line:#D9DEEA;
  --purple:#7C5CFC;
  --purple2:#9B7CFF;
  --cyan:#25D0C7;
  --pink:#F36BAE;
  --yellow:#FFC857;
  --danger:#D94B65;
  --shadow:0 20px 60px rgba(0,0,0,.25);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 10%, rgba(124,92,252,.35), transparent 30%),
    radial-gradient(circle at 85% 20%, rgba(37,208,199,.18), transparent 25%),
    linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
  color:var(--white);
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    sans-serif;
  line-height:1.5;
}

.wrap{
  max-width:1050px;
  margin:0 auto;
  padding:28px 16px 60px;
}

/* HEADER */

.hero{
  text-align:center;
  padding:18px 0 28px;
}

.badge{
  display:inline-block;
  padding:7px 14px;
  border-radius:999px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.18);
  color:#DCD5FF;
  font-size:13px;
  font-weight:700;
  letter-spacing:.3px;
  margin-bottom:12px;
}

h1{
  font-size:clamp(28px,6vw,46px);
  line-height:1.1;
  margin:0 0 12px;
  font-weight:900;
  letter-spacing:-1px;
}

.subtitle{
  max-width:650px;
  margin:auto;
  color:#C8C5DD;
  font-size:15px;
}

/* PROGRESS */

.progress-wrap{
  margin:0 auto 20px;
  max-width:700px;
}

.progress-top{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:#C8C5DD;
  margin-bottom:7px;
}

.progress{
  height:7px;
  background:rgba(255,255,255,.12);
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:25%;
  background:linear-gradient(90deg,var(--purple),var(--cyan));
  border-radius:20px;
  transition:.4s;
}

/* TABS */

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:16px;
  overflow-x:auto;
  padding-bottom:4px;
}

.tab{
  min-width:160px;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.07);
  color:#fff;
  border-radius:16px;
  padding:12px 14px;
  font:inherit;
  font-weight:800;
  cursor:pointer;
  text-align:left;
  transition:.2s;
}

.tab:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.12);
}

.tab small{
  display:block;
  color:#BEB9D6;
  font-weight:500;
  margin-top:2px;
}

.tab[aria-selected=true]{
  background:linear-gradient(135deg,#7555F5,#4D3BA8);
  border-color:#9C87FF;
  box-shadow:0 8px 25px rgba(124,92,252,.3);
}

/* GRID */

.grid{
  display:grid;
  gap:18px;
}

@media(min-width:850px){
  .grid{
    grid-template-columns:1fr 1fr;
    align-items:start;
  }
}

/* CARD */

.card{
  background:var(--card);
  color:var(--ink);
  border-radius:24px;
  padding:22px;
  box-shadow:var(--shadow);
  border:1px solid rgba(255,255,255,.5);
}

.card h2{
  font-size:18px;
  margin:0 0 14px;
  font-weight:850;
}

.card-intro{
  color:var(--mut);
  font-size:13px;
  margin-top:-7px;
  margin-bottom:18px;
}

/* INPUT */

label.f{
  display:block;
  font-size:13px;
  color:var(--mut);
  margin:18px 0 7px;
  font-weight:700;
}

input[type=text]{
  width:100%;
  font:inherit;
  padding:12px 14px;
  border-radius:13px;
  border:1px solid var(--line);
  background:#F7F8FB;
  color:var(--ink);
  outline:none;
  transition:.2s;
}

input[type=text]:focus{
  border-color:var(--purple);
  box-shadow:0 0 0 4px rgba(124,92,252,.1);
}

/* CHIPS */

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.chip{
  border:1px solid var(--line);
  background:#F5F6FA;
  color:var(--ink);
  border-radius:999px;
  padding:9px 13px;
  font:inherit;
  font-size:13px;
  cursor:pointer;
  transition:.2s;
}

.chip:hover{
  transform:translateY(-1px);
  border-color:var(--purple);
}

.chip[aria-pressed=true]{
  background:linear-gradient(135deg,var(--purple),#5E42D7);
  color:#fff;
  border-color:transparent;
  box-shadow:0 5px 15px rgba(124,92,252,.25);
}

/* HINT */

.hint{
  font-size:13px;
  color:var(--mut);
  margin:10px 0 0;
  background:#F5F6FA;
  border-radius:12px;
  padding:10px 12px;
}

/* SLIDERS */

.sl{
  display:grid;
  grid-template-columns:88px 1fr 24px;
  gap:9px;
  align-items:center;
  margin:12px 0;
  font-size:13px;
}

.sl span{
  font-weight:650;
}

.sl b{
  text-align:center;
  color:var(--purple);
}

input[type=range]{
  width:100%;
  accent-color:var(--purple);
  cursor:pointer;
}

/* RADAR */

.radar-box{
  position:relative;
  background:linear-gradient(145deg,#F7F5FF,#F2FAFA);
  border-radius:20px;
  padding:10px;
  margin:8px 0 16px;
}

.radar{
  width:100%;
  max-width:350px;
  display:block;
  margin:0 auto;
}

.radar text{
  fill:var(--ink);
  font:600 11px system-ui,sans-serif;
}

/* TAGS */

.ttl{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin:0 0 10px;
}

.tag{
  font-size:11px;
  font-weight:750;
  padding:5px 10px;
  border-radius:999px;
  background:#F1F3F8;
  border:1px solid #E1E5ED;
}

.tag.k{
  background:#FFF3C7;
  color:#765900;
  border-color:#FFE28A;
}

/* RESULT */

.name{
  font-size:23px;
  font-weight:900;
  margin:0 0 4px;
}

.role{
  color:var(--mut);
  font-size:13px;
  margin-bottom:14px;
}

.sec{
  border-top:1px dashed var(--line);
  padding-top:13px;
  margin-top:13px;
}

.sec b{
  display:block;
  font-size:13px;
  color:var(--mut);
  font-weight:750;
  margin-bottom:5px;
}

.sec ul{
  margin:0;
  padding-left:19px;
}

.sec li{
  margin:5px 0;
}

.red{
  color:var(--danger);
}

/* MOTIVATION SCORE */

.score{
  display:flex;
  align-items:center;
  gap:13px;
  padding:13px;
  margin:10px 0;
  border-radius:16px;
  background:linear-gradient(135deg,#F5F1FF,#EDFDFC);
}

.score-circle{
  width:54px;
  height:54px;
  flex:none;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
  font-weight:900;
  color:#fff;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
}

.score-text b{
  display:block;
  color:var(--ink);
}

.score-text span{
  color:var(--mut);
  font-size:12px;
}

/* BUTTON */

.btn{
  border:0;
  background:linear-gradient(135deg,var(--purple),#5D43D9);
  color:#fff;
  font:inherit;
  font-weight:800;
  border-radius:13px;
  padding:12px 17px;
  cursor:pointer;
  margin-top:16px;
  box-shadow:0 8px 20px rgba(124,92,252,.25);
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 25px rgba(124,92,252,.35);
}

.btn.secondary{
  background:#EEF0F6;
  color:var(--ink);
  box-shadow:none;
  margin-left:6px;
}

/* FOOTER */

.footer{
  text-align:center;
  color:#AAA6C4;
  font-size:12px;
  padding-top:25px;
}

/* ANIMATION */

.card{
  animation:appear .45s ease;
}

@keyframes appear{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="hero">
    <div class="badge">✦ HR-инструмент • Карта мотивации</div>

    <h1>Карта мотивации сотрудника</h1>

    <p class="subtitle">
      Определи, что действительно мотивирует человека,
      что снижает его вовлечённость и как подобрать индивидуальный подход.
    </p>
  </div>

  <div class="progress-wrap">
    <div class="progress-top">
      <span>Заполнение профиля</span>
      <span id="progressText">25%</span>
    </div>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <div class="tabs" role="tablist" id="tabs"></div>

  <div class="grid">

    <div class="card" id="form"></div>

    <div class="card" id="out"></div>

  </div>

  <div class="footer">
    Карта мотивации • интерактивный HR-инструмент
  </div>

</div>

<script>

var SEG={

hipo:{
n:'HiPo — талант',
f:'ключевой',
do:[
'Стретч-задача или проект выше текущего грейда',
'Наставник из топ-менеджмента',
'Прозрачный карьерный трек на 12–18 месяцев'
],
risk:'Уходит, если рост остановился на 3–6 месяцев'
},

core:{
n:'Core performer',
f:'стабильный',
do:[
'Конкретное признание за результат',
'Развитие в глубину: курс, сертификат, экспертная роль',
'Справедливый бонус за стабильность'
],
risk:'Рутина и выгорание, тихое снижение вовлечённости'
},

low:{
n:'Low performer',
f:'проблемный',
do:[
'Диагностика причины: навык, воля или ресурсы?',
'Короткие цели на 2 недели и еженедельная обратная связь',
'Чёткое «что такое хорошо» с примерами'
],
risk:'Ярлык «слабый» и демотивация; без плана решение: развитие или выход'
}

};


var TYPE={

driver:{
n:'Драйвер',
i:'⚡',
give:'Цель с вызовом, полномочия, скорость решений',
avoid:'Микроменеджмент, долгие согласования',
say:'Какой результат ты хочешь получить в этом квартале и что тебе нужно от меня?'
},

analyst:{
n:'Аналитик',
i:'🔍',
give:'Данные, время на анализ, понятные критерии',
avoid:'Давление «решай сейчас», размытые задачи',
say:'Вот цифры и критерии. Как бы ты оценил ситуацию и какой вариант предложил бы?'
},

comm:{
n:'Коммуникатор',
i:'💬',
give:'Работа с людьми, командные проекты, обратная связь',
avoid:'Изоляция, работа «в стол», сухие отчёты',
say:'Ты сильно влияешь на команду. Кого ты хочешь вовлечь и как мне тебя поддержать?'
},

exec:{
n:'Исполнитель',
i:'🛠',
give:'Ясные задачи, сроки и стандарты, стабильность',
avoid:'Постоянные изменения правил, расплывчатые цели',
say:'Давай зафиксируем, что именно ждём и к какому сроку. Что может помешать?'
}

};


var MOT={

amb:{
n:'Амбициозный',
d:[3,5,5,4,2],
t:'Статус, должность, рейтинг'
},

ana:{
n:'Аналитический',
d:[3,4,2,5,2],
t:'Экспертиза, логика, справедливые правила'
},

pra:{
n:'Прагматичный',
d:[5,3,2,3,1],
t:'Деньги, условия, понятная выгода'
},

val:{
n:'Ценностный',
d:[2,3,4,3,5],
t:'Миссия, команда, смысл'
}

};


var DRV=[

{
n:'Деньги',
a:'Бонус привязан к измеримой цели + пересмотр вилки по рынку'
},

{
n:'Рост',
a:'Индивидуальный план развития: курс, ротация, новая роль'
},

{
n:'Признание',
a:'Публичная благодарность за конкретный результат, а не «молодец»'
},

{
n:'Автономия',
a:'Свобода выбора метода и гибкий график при чётком результате'
},

{
n:'Смысл',
a:'Связать задачу с миссией: показать, кому и как она помогает'
}

];


var PAIR={
driver:'amb',
analyst:'ana',
exec:'pra',
comm:'val'
};


var P=[
mk('Коллега 1'),
mk('Коллега 2')
];

var cur=0;


function mk(n){

return{
name:n,
seg:'core',
type:'driver',
mot:'amb',
d:MOT.amb.d.slice()
};

}


function esc(s){

return String(s).replace(/[&<>"]/g,function(c){

return{
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;'
}[c];

});

}


function chips(key,obj){

var p=P[cur];

return '<div class="chips">'+

Object.keys(obj).map(function(k){

return '<button class="chip" data-k="'+key+
'" data-v="'+k+
'" aria-pressed="'+(p[key]===k)+'">'+
(obj[k].i?obj[k].i+' ':'')+
obj[k].n+
'</button>';

}).join('')+

'</div>';

}


function tabs(){

document.getElementById('tabs').innerHTML=

P.map(function(p,i){

return '<button class="tab" role="tab" data-i="'+i+
'" aria-selected="'+(i===cur)+'">'+
'👤 '+esc(p.name||'Без имени')+
'<small>'+SEG[p.seg].n+'</small>'+
'</button>';

}).join('');

}


function form(){

var p=P[cur];

document.getElementById('form').innerHTML=

'<h2>👤 Профиль сотрудника</h2>'+

'<p class="card-intro">Заполни несколько параметров — система сформирует индивидуальную карту.</p>'+

'<label class="f" for="nm">Имя или роль сотрудника</label>'+

'<input type="text" id="nm" value="'+
esc(p.name)+
'" maxlength="30" placeholder="Например: Анна, менеджер проекта">'+


'<label class="f">1. Сегмент: результат и потенциал</label>'+

chips('seg',SEG)+


'<label class="f">2. Тип: как человек работает</label>'+

chips('type',TYPE)+


'<label class="f">3. Главный мотиватор</label>'+

chips('mot',MOT)+


'<p class="hint" id="mh">💡 '+
MOT[p.mot].t+
'. Ползунки ниже можно скорректировать вручную.</p>'+


'<label class="f">4. Сила мотиваторов — от 0 до 5</label>'+

DRV.map(function(x,i){

return '<div class="sl">'+

'<span>'+x.n+'</span>'+

'<input type="range" min="0" max="5" step="1" value="'+
p.d[i]+
'" data-d="'+i+'" aria-label="'+x.n+'">'+

'<b id="v'+i+'">'+
p.d[i]+
'</b>'+

'</div>';

}).join('');

}


function radar(p){

var c=150,
R=100,
n=5,
pts=[],
rings='',
ax='',
lab='';


for(var r=1;r<=5;r++){

var rp=[];

for(var i=0;i<n;i++){

var a=-Math.PI/2+i*2*Math.PI/n;

rp.push(

(c+R*r/5*Math.cos(a)).toFixed(1)+','+

(c+R*r/5*Math.sin(a)).toFixed(1)

);

}

rings+=
'<polygon points="'+rp.join(' ')+
'" fill="none" stroke="#D9DEEA" stroke-width="1"/>';

}


for(var i=0;i<n;i++){

var a=-Math.PI/2+i*2*Math.PI/n;

var v=p.d[i]/5;

ax+=
'<line x1="'+c+
'" y1="'+c+
'" x2="'+(c+R*Math.cos(a)).toFixed(1)+
'" y2="'+(c+R*Math.sin(a)).toFixed(1)+
'" stroke="#D9DEEA"/>';


pts.push(

(c+R*Math.max(v,.04)*Math.cos(a)).toFixed(1)+','+

(c+R*Math.max(v,.04)*Math.sin(a)).toFixed(1)

);


var lx=c+(R+22)*Math.cos(a);

var ly=c+(R+16)*Math.sin(a);

lab+=
'<text x="'+lx.toFixed(1)+
'" y="'+(ly+4).toFixed(1)+
'" text-anchor="middle">'+
DRV[i].n+
'</text>';

}


return '<svg class="radar" viewBox="0 0 300 300" role="img" aria-label="Радар мотивации">'+

rings+
ax+

'<polygon points="'+pts.join(' ')+
'" fill="#7C5CFC" fill-opacity=".25" stroke="#7C5CFC" stroke-width="3"/>'+

lab+

'</svg>';

}


function top2(p){

return p.d.map(function(v,i){

return{
v:v,
i:i
};

}).sort(function(a,b){

return b.v-a.v||a.i-b.i;

}).slice(0,2);

}


function score(p){

var total=p.d.reduce(function(a,b){

return a+b;

},0);

var percent=Math.round(total/(p.d.length*5)*100);

var text='Низкая выраженность мотиваторов';

if(percent>=70){

text='Высокая выраженность мотиваторов';

}else if(percent>=45){

text='Средняя выраженность мотиваторов';

}

return{
percent:percent,
text:text
};

}


function out(){

var p=P[cur];

var s=SEG[p.seg];

var t=TYPE[p.type];

var t2=top2(p);

var low=p.d.map(function(v,i){

return{
v:v,
i:i
};

}).sort(function(a,b){

return a.v-b.v||a.i-b.i;

})[0];


var li=function(a){

return '<ul>'+
a.map(function(x){

return '<li>'+x+'</li>';

}).join('')+
'</ul>';

};


var tools=t2.map(function(x){

return DRV[x.i].n+': '+DRV[x.i].a;

});


var sc=score(p);


document.getElementById('out').innerHTML=

'<h2>✨ Результат анализа</h2>'+

'<p class="name">'+
t.i+' '+
esc(p.name||'Без имени')+
'</p>'+

'<p class="role">'+
'Индивидуальный профиль мотивации сотрудника'+
'</p>'+

'<div class="ttl">'+

'<span class="tag k">Формула: '+s.f+'</span>'+

'<span class="tag">'+s.n+'</span>'+

'<span class="tag">'+t.n+'</span>'+

'<span class="tag">'+MOT[p.mot].n+'</span>'+

'</div>'+

'<div class="score">'+

'<div class="score-circle">'+
sc.percent+'%'+
'</div>'+

'<div class="score-text">'+

'<b>Выраженность мотивации</b>'+

'<span>'+sc.text+'</span>'+

'</div>'+

'</div>'+

'<div class="radar-box">'+
radar(p)+
'</div>'+

'<div class="sec">'+

'<b>🎯 Что мотивирует сильнее всего</b>'+

li(tools)+

'</div>'+

'<div class="sec">'+

'<b>⚡ Что может демотивировать</b>'+

'<span class="red">'+
t.avoid+
'. Слабый мотиватор: '+
DRV[low.i].n.toLowerCase()+
'. Не стоит делать на нём основной акцент.'+
'</span>'+

'</div>'+

'<div class="sec">'+

'<b>💡 Как лучше мотивировать</b>'+

t.give+

'</div>'+

'<div class="sec">'+

'<b>🚀 Рекомендации по развитию</b>'+

li(s.do)+

'</div>'+

'<div class="sec">'+

'<b>💬 Вопрос для разговора с сотрудником</b>'+

'<div class="hint">'+
t.say+
'</div>'+

'</div>'+

'<div class="sec">'+

'<b>⚠️ Риск потери мотивации</b>'+

'<span class="red">'+
s.risk+
'</span>'+

'</div>'+

'<button class="btn" id="cp">📋 Скопировать карту</button>'+

'<button class="btn secondary" id="reset">↺ Сбросить</button>'+

'<p class="hint" id="cm"></p>';



document.getElementById('cp').onclick=function(){

var txt=

'КАРТА МОТИВАЦИИ СОТРУДНИКА\n\n'+

'Сотрудник: '+p.name+'\n'+

'Сегмент: '+s.n+' ('+s.f+')\n'+
'Тип: '+t.n+'\n'+
'Мотиватор: '+MOT[p.mot].n+'\n\n'+

'Сильные мотиваторы:\n'+
tools.join('\n')+'\n\n'+

'Как мотивировать:\n'+
t.give+'\n\n'+

'Рекомендации:\n'+
s.do.join('\n')+'\n\n'+

'Риск:\n'+
s.risk;


try{

navigator.clipboard.writeText(txt).then(

function(){

document.getElementById('cm').textContent=
'✓ Карта скопирована в буфер обмена';

},

function(){

document.getElementById('cm').textContent=
'Не удалось скопировать.';

}

);

}catch(e){

document.getElementById('cm').textContent=
'Не удалось скопировать.';

}

};


document.getElementById('reset').onclick=function(){

P[cur]=mk(P[cur].name||'Коллега');

all();

};

}


function updateProgress(){

var p=P[cur];

var filled=0;

if(p.name && p.name.trim()) filled++;

if(p.seg) filled++;

if(p.type) filled++;

if(p.mot) filled++;

var percent=Math.round(filled/4*100);

document.getElementById('progressBar').style.width=
percent+'%';

document.getElementById('progressText').textContent=
percent+'%';

}


function all(){

tabs();

form();

out();

updateProgress();

}


document.addEventListener('click',function(e){

var b=e.target.closest('[data-k],[data-i]');

if(!b)return;

var p=P[cur];


if(b.dataset.i!==undefined){

cur=+b.dataset.i;

all();

return;

}


var k=b.dataset.k;

var v=b.dataset.v;

p[k]=v;


if(k==='type'){

p.mot=PAIR[v];

p.d=MOT[p.mot].d.slice();

}


if(k==='mot'){

p.d=MOT[v].d.slice();

}


all();

});


document.addEventListener('input',function(e){

var p=P[cur];


if(e.target.id==='nm'){

p.name=e.target.value;

tabs();

out();

updateProgress();

return;

}


if(e.target.dataset.d!==undefined){

var i=+e.target.dataset.d;

p.d[i]=+e.target.value;

document.getElementById('v'+i).textContent=
e.target.value;

out();

}

});


all();

</script>

</body>
</html>
